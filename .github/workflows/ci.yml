name: CI

# External contributions are mirrored onto pull-request/N branches by
# copy-pr-bot, so the gate is on push rather than pull_request.
on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
      - "release/v*"

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
      - run: make ci
