// Fixture for the rules that are not about presence. Each is reachable only
// from a declaration shape that is otherwise legal, so without this file they
// could be deleted from the compiler with the suite staying green.

syntax = "proto3";

package nv.telemetry.v1;

import "nv/telemetry/options/v1/annotations.proto";

message Hashed {
  // Hashing without validation: canonicalization never runs, so equal content
  // would not hash equal.
  option (nv.telemetry.options.v1.message_invariant) = {
    hashable: true
  };

  optional double value = 1;
}

message Extendable {
  extensions 100 to 200;
}

// A recursion bound on a type no chain of fields leads back to. Nothing
// recurses, so nothing is bounded.
message Flat {
  option (nv.telemetry.options.v1.message_invariant) = {
    validated: true
    max_depth: 4
  };

  optional string a = 1;
}

// The same bound where it means something: Nest reaches itself through Branch,
// so this must not be flagged.
message Nest {
  option (nv.telemetry.options.v1.message_invariant) = {
    validated: true
    max_depth: 4
  };

  optional Branch branch = 1;
}

message Branch {
  repeated Nest children = 1;
}

// Hash-reachable via HashRoot, so only the contradiction rule fires here.
message HashRoot {
  option (nv.telemetry.options.v1.message_invariant) = {
    validated: true
    hashable: true
  };

  optional Conflicted child = 1;
}

message Conflicted {
  uint64 counter = 1 [(nv.telemetry.options.v1.field_invariant) = {
    zero_is_meaningful: true
    collection_metadata: true
  }];
}

// Reached by no hashable message, so its collection_metadata is a no-op.
message Island {
  optional string tag = 1 [(nv.telemetry.options.v1.field_invariant) = {
    collection_metadata: true
    max_len: 64
  }];
}

// A declaration site the invariant rules do not reach.
extend Extendable {
  optional double sneaky = 100;
}
