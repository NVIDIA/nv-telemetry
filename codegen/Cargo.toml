[package]
name = "nv-telemetry-codegen"
description = "Schema compiler for nv-telemetry: validators, wrappers, hashing, and projections"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# A build-time tool. Nothing that consumes the data plane depends on this
# crate, because generated code is checked in.
[[bin]]
name = "nv-telemetry-codegen"
path = "src/main.rs"

[dependencies]
nv-telemetry-schema.workspace = true
prettyplease.workspace = true
proc-macro2.workspace = true
quote.workspace = true
prost-build.workspace = true
prost-reflect.workspace = true
prost-types.workspace = true
syn.workspace = true

[dev-dependencies]
# Fixture schemas for compiler tests are compiled in-process; the depth and
# fidelity tests encode dynamic messages and compare them against the
# generated types.
prost.workspace = true
protox.workspace = true

[lints]
workspace = true
