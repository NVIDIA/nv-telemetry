[workspace]
members = ["core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/nv-telemetry"

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "rc", "std"] }
serde_json = "1"
